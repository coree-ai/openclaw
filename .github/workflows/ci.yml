name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/marketplace.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.mcp.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('openclaw.json', 'utf8'))"
          echo "All JSON files are valid"

      - name: Check version consistency
        run: |
          PLUGIN_VER=$(node -e "const c=JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8')); console.log(c.version.split('-')[0])")
          MCP_VER=$(node -e "const c=JSON.parse(require('fs').readFileSync('.mcp.json','utf8')); console.log(c.mcpServers.coree.args.find(a=>a.startsWith('@coree-ai/coree@')).replace('@coree-ai/coree@',''))")
          CLAW_VER=$(node -e "const c=JSON.parse(require('fs').readFileSync('openclaw.json','utf8')); console.log(c.mcp.servers.coree.args.find(a=>a.startsWith('@coree-ai/coree@')).replace('@coree-ai/coree@',''))")
          echo "plugin.json:  $PLUGIN_VER"
          echo ".mcp.json:    $MCP_VER"
          echo "openclaw.json: $CLAW_VER"
          [ "$PLUGIN_VER" = "$MCP_VER" ] && [ "$MCP_VER" = "$CLAW_VER" ] || (echo "Version mismatch" && exit 1)
          echo "Versions match"
